services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: vetbot-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: vetbot-evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vetbot-evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vetbot-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://evolution-api:8080
    depends_on:
      - evolution-api

volumes:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
